<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Memory Game</title>
    <!-- Favicon using a Pi symbol SVG data URI -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>π</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'pi-memory-game-default';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

        let db = null;
        let auth = null;
        let currentUser = null;

        if (firebaseConfig) {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            
            async function initAuth() {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    currentUser = auth.currentUser;
                    loadGlobalLeaderboard();
                } catch (e) {
                    console.error("Auth error:", e);
                }
            }
            initAuth();
        }

        // Pi digits string
        const PI_DIGITS = "31415926535897932384626433832795028841971693993751058209749445923078164062862089986280348253421170679";
        
        let gameState = 'menu'; // menu, playing, gameover
        let currentIndex = 0;
        let playerName = localStorage.getItem('pi_player_name') || 'Player';

        window.appData = {
            getDigits: () => PI_DIGITS,
            getState: () => gameState,
            setState: (st) => { gameState = st; },
            getCurrentIndex: () => currentIndex,
            setCurrentIndex: (idx) => { currentIndex = idx; },
            getPlayerName: () => playerName,
            setPlayerName: (name) => { playerName = name; localStorage.setItem('pi_player_name', name); },
            submitScore: async (score) => {
                if (!db || !currentUser) {
                    // Fallback to local simulation if firebase isn't active
                    saveLocalScore(playerName, score);
                    return;
                }
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard'), {
                        name: playerName || 'Anonymous',
                        score: score,
                        timestamp: Date.now()
                    });
                    loadGlobalLeaderboard();
                } catch (e) {
                    console.error("Error submitting score:", e);
                    saveLocalScore(playerName, score);
                }
            }
        };

        function saveLocalScore(name, score) {
            let scores = JSON.parse(localStorage.getItem('pi_local_leaderboard') || '[]');
            scores.push({ name, score, timestamp: Date.now() });
            scores.sort((a, b) => b.score - a.score);
            localStorage.setItem('pi_local_leaderboard', JSON.stringify(scores.slice(0, 10)));
            renderLeaderboard(scores.slice(0, 10));
        }

        function loadGlobalLeaderboard() {
            if (!db) {
                const scores = JSON.parse(localStorage.getItem('pi_local_leaderboard') || '[]');
                renderLeaderboard(scores);
                return;
            }
            try {
                const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard'));
                onSnapshot(q, (snapshot) => {
                    let scores = [];
                    snapshot.forEach(doc => {
                        scores.push(doc.data());
                    });
                    scores.sort((a, b) => b.score - a.score);
                    renderLeaderboard(scores.slice(0, 10));
                }, (error) => {
                    console.error("Leaderboard read error:", error);
                });
            } catch (e) {
                console.error("Leaderboard setup error:", e);
            }
        }

        function renderLeaderboard(scores) {
            const container = document.getElementById('leaderboard-list');
            if (!container) return;
            if (scores.length === 0) {
                container.innerHTML = '<div class="text-slate-400 text-sm text-center py-2">No scores yet. Be the first!</div>';
                return;
            }
            container.innerHTML = scores.map((s, idx) => `
                <div class="flex justify-between items-center bg-slate-800 px-3 py-2 rounded-lg text-sm mb-1 border border-slate-700/50">
                    <span class="font-medium text-slate-300">${idx + 1}. ${escapeHtml(s.name)}</span>
                    <span class="font-bold text-emerald-400">${s.score} digits</span>
                </div>
            `).join('');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.onload = () => {
            loadGlobalLeaderboard();
            setupUI();
        };
    </script>

    <div class="w-full max-w-md bg-slate-800/80 backdrop-blur border border-slate-700 rounded-2xl shadow-xl p-6 flex flex-col items-center">
        <h1 class="text-3xl font-bold tracking-tight mb-1 text-emerald-400 flex items-center gap-2">
            <span>π</span> Pi Memory Game
        </h1>
        <p class="text-slate-400 text-sm mb-6 text-center">Test how many digits of Pi you can memorize!</p>

        <div id="app-container" class="w-full flex flex-col items-center">
            <!-- Menu Screen -->
            <div id="menu-screen" class="w-full flex flex-col items-center">
                <div class="w-full mb-4">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Your Name</label>
                    <input type="text" id="player-name-input" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500" placeholder="Enter your name">
                </div>
                <button id="start-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 px-4 rounded-xl transition duration-200 shadow-lg shadow-emerald-500/20 mb-6">
                    Start Game
                </button>

                <!-- Leaderboard Section in exact same place -->
                <div class="w-full border-t border-slate-700 pt-4">
                    <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3 flex items-center justify-between">
                        <span>Global Leaderboard</span>
                        <span class="text-xs text-emerald-400 font-normal">Live Sync</span>
                    </h2>
                    <div id="leaderboard-list" class="w-full max-h-48 overflow-y-auto pr-1">
                        <div class="text-slate-400 text-sm text-center py-2">Loading scores...</div>
                    </div>
                </div>
            </div>

            <!-- Playing Screen -->
            <div id="playing-screen" class="w-full hidden flex flex-col items-center">
                <div class="flex justify-between w-full mb-6 bg-slate-900/60 p-3 rounded-xl border border-slate-700/50">
                    <div>
                        <span class="text-xs text-slate-400 block">Score</span>
                        <span id="current-score" class="text-xl font-bold text-emerald-400">0</span>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400 block">Target Pi Digit</span>
                        <span id="target-digit-hint" class="text-xs font-mono text-slate-300">3 . 1 ...</span>
                    </div>
                </div>

                <div class="text-center mb-6">
                    <span class="text-sm text-slate-400 block mb-1">Current Sequence Entered:</span>
                    <div id="entered-sequence" class="font-mono text-xl text-emerald-300 bg-slate-900 border border-slate-700 rounded-xl p-3 min-h-[50px] flex items-center justify-center break-all max-w-full">
                        3.
                    </div>
                </div>

                <!-- Keypad -->
                <div class="grid grid-cols-3 gap-3 w-full mb-4">
                    <button class="num-btn bg-slate-700 hover:bg-slate-600 font-bold text-xl py-4 rounded-xl transition active:scale-95" data-num="1">1</button>
                    <button class="num-btn bg-slate-700 hover:bg-slate-600 font-bold text-xl py-4 rounded-xl transition active:scale-95" data-num="2">2</button>
                    <button class="num-btn bg-slate-700 hover:bg-slate-600 font-bold text-xl py-4 rounded-xl transition active:scale-95" data-num="3">3</button>
                    <button class="num-btn bg-slate-700 hover:bg-slate-600 font-bold text-xl py-4 rounded-xl transition active:scale-95" data-num="4">4</button>
                    <button class="num-btn bg-slate-700 hover:bg-slate-600 font-bold text-xl py-4 rounded-xl transition active:scale-95" data-num="5">5</button>
                    <button class="num-btn bg-slate-700 hover:bg-slate-600 font-bold text-xl py-4 rounded-xl transition active:scale-95" data-num="6">6</button>
                    <button class="num-btn bg-slate-700 hover:bg-slate-600 font-bold text-xl py-4 rounded-xl transition active:scale-95" data-num="7">7</button>
                    <button class="num-btn bg-slate-700 hover:bg-slate-600 font-bold text-xl py-4 rounded-xl transition active:scale-95" data-num="8">8</button>
                    <button class="num-btn bg-slate-700 hover:bg-slate-600 font-bold text-xl py-4 rounded-xl transition active:scale-95" data-num="9">9</button>
                    <button id="clear-btn" class="bg-rose-900/40 hover:bg-rose-900/60 border border-rose-700/50 text-rose-300 font-semibold py-3 rounded-xl transition text-sm">Clear</button>
                    <button class="num-btn bg-slate-700 hover:bg-slate-600 font-bold text-xl py-4 rounded-xl transition active:scale-95" data-num="0">0</button>
                    <button id="quit-btn" class="bg-slate-700 hover:bg-slate-600 text-slate-300 font-semibold py-3 rounded-xl transition text-sm">Quit</button>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="gameover-screen" class="w-full hidden flex flex-col items-center text-center">
                <div class="mb-4 text-rose-400 font-bold text-lg">Incorrect Digit!</div>
                <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl w-full mb-6">
                    <span class="text-xs text-slate-400 block mb-1">Final Score</span>
                    <span id="final-score" class="text-3xl font-bold text-emerald-400">0</span>
                    <span class="text-xs text-slate-400 block mt-2">Correct digits of Pi memorized</span>
                </div>
                <div class="flex gap-3 w-full">
                    <button id="restart-btn" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-emerald-500/20">
                        Play Again
                    </button>
                    <button id="menu-btn" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-3 px-4 rounded-xl transition">
                        Main Menu
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function setupUI() {
            const nameInput = document.getElementById('player-name-input');
            nameInput.value = window.appData.getPlayerName();

            document.getElementById('start-btn').addEventListener('click', () => {
                const name = nameInput.value.trim() || 'Player';
                window.appData.setPlayerName(name);
                window.appData.setState('playing');
                window.appData.setCurrentIndex(0);
                showScreen('playing');
                updateGameDisplay();
            });

            document.getElementById('quit-btn').addEventListener('click', () => {
                window.appData.setState('menu');
                showScreen('menu');
            });

            document.getElementById('menu-btn').addEventListener('click', () => {
                window.appData.setState('menu');
                showScreen('menu');
            });

            document.getElementById('restart-btn').addEventListener('click', () => {
                window.appData.setState('playing');
                window.appData.setCurrentIndex(0);
                showScreen('playing');
                updateGameDisplay();
            });

            document.getElementById('clear-btn').addEventListener('click', () => {
                window.appData.setCurrentIndex(0);
                updateGameDisplay();
            });

            document.querySelectorAll('.num-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const digit = e.target.getAttribute('data-num');
                    const piDigits = window.appData.getDigits();
                    const currentIndex = window.appData.getCurrentIndex();

                    if (piDigits[currentIndex] === digit) {
                        const newIndex = currentIndex + 1;
                        window.appData.setCurrentIndex(newIndex);
                        updateGameDisplay();
                    } else {
                        // Game Over
                        const score = currentIndex;
                        document.getElementById('final-score').textContent = score;
                        window.appData.submitScore(score);
                        showScreen('gameover');
                    }
                });
            });
        }

        function showScreen(screenName) {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('playing-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');

            if (screenName === 'menu') {
                document.getElementById('menu-screen').classList.remove('hidden');
            } else if (screenName === 'playing') {
                document.getElementById('playing-screen').classList.remove('hidden');
            } else if (screenName === 'gameover') {
                document.getElementById('gameover-screen').classList.remove('hidden');
            }
        }

        function updateGameDisplay() {
            const currentIndex = window.appData.getCurrentIndex();
            const piDigits = window.appData.getDigits();
            document.getElementById('current-score').textContent = currentIndex;
            
            let displayed = "3.";
            for (let i = 0; i < currentIndex; i++) {
                displayed += piDigits[i];
            }
            document.getElementById('entered-sequence').textContent = displayed;
        }
    </script>
</body>
</html>
